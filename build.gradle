plugins { id 'fabric-loom' version '1.17.+' }
version = '1.0.0'
group = 'de.server'
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}
base { archivesName = 'server-performance-bar' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
